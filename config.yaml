# 火场研究流水线配置。改这里，不要在代码里写死参数。
pipeline_version: "v1.4"   # v1.4：不再使用 STAC 元数据中错误的 -0.1 偏移；v1.3：修复暗像元 NDVI/EVI 缺失、风速与降水缺失； v1.1：火点约束火烧范围；v1.2：森林过滤、火中观测与燃烧当天天气、邻域植被

grid:
  resolution_m: 30          # 统一网格分辨率
  bbox_half_deg: 0.06       # 没有边界时：以中心点为中心的半边长（度）
  boundary_buffer_m: 1000   # 有边界时：边界外扩的距离

sentinel2:
  stac_url: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-l2a"   # c1 版尚未覆盖 2022 年华南
  # 实测（scripts/check_offset.py）：该集合的 COG 原始 DN 已去掉 +1000 偏移（林地红光 DN 中位数约 270），
  # 但元数据仍写 offset=-0.1；照元数据再减会把反射率压成负值。因此只用 scale，不用元数据 offset。
  ignore_stac_offset: true
  # 相对日期窗口（天）。火前相对起火日，火后相对结束日。所有火场一致。
  pre_window_days: [-60, -1]
  post_window_days: [3, 45]
  pre_window_fallback: [-120, -1]   # 标准窗口没有影像时才用（质检记录 window_relaxed=true）
  post_window_fallback: [3, 90]
  max_scene_cloud: 70       # 整景云量上限（逐像元去云才是主要手段）
  # SCL 有效类别：2 暗区（新鲜火烧迹地常被分到这一类，必须保留）、4 植被、5 裸地、6 水体、7 未分类
  scl_valid: [2, 4, 5, 6, 7]
  min_valid_fraction: 0.6   # 合成后有效像元比例低于此值 → 质检不通过

burn:
  # 没有官方边界时，用 dNBR 自动提取火烧范围（不取绝对值）
  dnbr_threshold: 0.10
  min_patch_pixels: 50
  unburned_ring_m: [300, 1500]   # 有边界时：计算 dNBR 偏移量用的火场外环
  min_hotspots: 3           # 至少几个 VIIRS 火点才用火点法
  hotspot_near_m: 750       # 火烧像元离最近火点的最大距离
  background_far_m: 3000    # 离火点这么远的像元作为“未燃背景”，用于扣除干旱/物候偏移
  hotspot_pad_days: 3       # 取火点时，日期前后各放宽几天

terrain:
  stac_collection: "cop-dem-glo-30"
  tpi_radius_m: 300

landcover:
  worldcover_url: "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif"

weather:
  archive_url: "https://archive-api.open-meteo.com/v1/archive"
  antecedent_days: [7, 30, 90]
  grid_points: 3            # 每个火场取 3x3 个气象点做插值

discovery:
  # 省份大致范围（西,南,东,北）。相邻省份范围有重叠，重叠处的省份标签可能不准，只用于分层抽样。
  regions:
    湖南: [108.8, 24.6, 114.3, 30.1]
    江西: [113.6, 24.5, 118.5, 30.1]
    广西: [104.5, 20.9, 112.1, 26.4]
    广东: [109.7, 20.2, 117.3, 25.5]
    福建: [115.8, 23.5, 120.7, 28.3]
    浙江: [118.0, 27.0, 122.9, 31.2]
  seasons:
    - ["2022-08-01", "2022-12-31"]   # 2022 年秋季大旱
    - ["2023-01-01", "2023-04-30"]
    - ["2023-10-01", "2024-04-30"]
  min_points: 15        # 一场火至少 15 个火点（去掉零星的秸秆焚烧）
  top_per_group: 10     # 每省每季最多取火点最多的 10 场

qc:
  min_forest_share: 0.5    # 火烧范围内 WorldCover 林地占比下限
  min_area_ha: 20
  min_samples: 30

sample:
  min_spacing_px: 3         # 采样点最小间距（像元），减弱相邻像元自相关
  max_per_fire: 2000
  seed: 42

split:
  test_fraction: 0.20
  stratify_by: ["province"]
  seed: 20261109

model:
  target: "dnbr_offset"     # 连续 dNBR（已减去火场外未燃区偏移）
  features:
    vegetation: ["nbr_pre", "ndvi_pre", "evi_pre", "ndmi_pre", "nbr_pre_mean300", "ndvi_pre_sd300"]
    terrain: ["elevation", "slope", "northness", "eastness", "tpi", "twi"]
    landcover: ["worldcover"]
    weather_fire: ["fire_tmax", "fire_rhmin", "fire_windmax", "fire_vpdmax"]
    weather_antecedent: ["prcp_7d", "prcp_30d", "prcp_90d", "dry_days_30d", "soilm_7d"]
    # 火中观测（VIIRS 火点）——不是火前信息，单独作为一个情景报告
    fire_obs: ["hs_dist", "hs_count_750", "hs_frp_max_750", "hs_frp_nearest", "burn_day",
               "bd_tmax", "bd_rhmin", "bd_windmax", "bd_vpdmax"]
  scenarios:
    prefire: ["vegetation", "terrain", "landcover", "weather_fire", "weather_antecedent"]
    with_fire_obs: ["vegetation", "terrain", "landcover", "weather_fire", "weather_antecedent", "fire_obs"]
  algorithms: ["mean_baseline", "ridge", "random_forest", "lightgbm"]
  cv_folds: 5
  acceptance_r2: 0.90       # 导师标准：封存测试火场逐场 R²
