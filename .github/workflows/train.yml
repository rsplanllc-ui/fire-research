name: 训练与评价

on:
  workflow_dispatch:
    inputs:
      task:
        description: "train=开发集交叉验证；ablation=删减因子组；final-test=封存测试（只在开发完成后跑）"
        type: choice
        options: [train, ablation, within-fire, diag, split-lock, final-test, inspect, importance, cnn]
        default: train
      scenario:
        description: "因子情景：prefire=只用火前因子；with_fire_obs=火前+火中观测（火点）"
        type: choice
        options: [prefire, with_fire_obs]
        default: prefire
      algo:
        description: "final-test / ablation 使用的算法"
        default: lightgbm
      epochs:
        description: "cnn 训练轮数"
        default: "12"
      max_per_fire:
        description: "cnn 每场火最多样本数"
        default: "1200"
      scales:
        description: "within-fire 的聚合尺度（米，逗号分隔），如 30,90,150,300"
        default: "30"
      n_inspect:
        description: "inspect 抽查几场火"
        default: "8"
      confirm_final:
        description: "运行最终测试请填 YES"
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt && pip install -e .
      - name: 开发集交叉验证
        if: inputs.task == 'train'
        run: python -m firepipe.cli train --scenario ${{ inputs.scenario }}
      - name: 删减因子组
        if: inputs.task == 'ablation'
        run: python -m firepipe.cli ablation --algo ${{ inputs.algo }} --scenario ${{ inputs.scenario }}
      - name: 划分并锁定封存测试火场
        if: inputs.task == 'split-lock'
        run: python -m firepipe.cli split --lock
      - name: 数据检查
        if: inputs.task == 'diag'
        run: python -m firepipe.cli diag
      - name: 同场内部上限诊断
        if: inputs.task == 'within-fire'
        run: python -m firepipe.cli within-fire --scenario ${{ inputs.scenario }} --scales "${{ inputs.scales || '30' }}"
      - name: CNN 对比实验
        if: inputs.task == 'cnn'
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m firepipe.cli cnn --scenario ${{ inputs.scenario }} --epochs ${{ inputs.epochs || '12' }} --max-per-fire ${{ inputs.max_per_fire || '1200' }}
      - name: 逐变量重要性
        if: inputs.task == 'importance'
        run: python -m firepipe.cli importance --algo ${{ inputs.algo }} --scenario ${{ inputs.scenario }}
      - name: 抽查出图
        if: inputs.task == 'inspect'
        run: python -m firepipe.cli inspect --n ${{ inputs.n_inspect || '8' }}
      - name: 上传抽查图
        if: inputs.task == 'inspect'
        uses: actions/upload-artifact@v4
        with:
          name: inspect
          path: inspect/
      - name: 抽查图推送到 inspect-output 分支
        if: inputs.task == 'inspect'
        run: |
          git config user.name "fire-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin inspect-output || true
          git checkout -B inspect-output
          git add -f inspect/*.png
          git commit -m "抽查图 $(date -u +%FT%H:%M)" || true
          git push -f origin inspect-output
      - name: 最终测试
        if: inputs.task == 'final-test' && inputs.confirm_final == 'YES'
        run: python -m firepipe.cli final-test --algo ${{ inputs.algo }} --scenario ${{ inputs.scenario }} --confirm
