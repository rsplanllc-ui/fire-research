name: 批量发现火灾（按配置）

on:
  workflow_dispatch:
    inputs:
      provinces:
        description: "只跑这些省份（空格分隔，留空=全部）"
        default: ""
      seasons:
        description: "火季（空格分隔，形如 2019-10-01:2020-04-30；留空=用配置）"
        default: ""

concurrency: discover   # 同一时间只跑一个发现任务，避免编号冲突

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m firepipe.cli discover-batch ${{ inputs.provinces && format('--provinces {0}', inputs.provinces) || '' }} ${{ inputs.seasons && format('--seasons {0}', inputs.seasons) || '' }}
